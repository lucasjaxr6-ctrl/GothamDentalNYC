<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gotham Dental · Reels</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0f1230;color:#fff;font-family:'Inter Tight',system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:56px 24px 72px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(2.6rem,6vw,4.2rem);margin:0 0 8px;line-height:1}
h1 em{color:#aeb7ff}
p.lead{color:#cfd1e3;margin:0 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px}
figure{margin:0}
video{width:100%;aspect-ratio:9/16;border-radius:20px;background:#000;display:block}
figcaption{margin-top:14px;font-weight:600}
figcaption span{display:block;font-weight:400;color:#b9bcd8;font-size:.92rem;margin-top:4px}
a{color:#aeb7ff}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gotham Dental · <em>Reels</em></h1>
  <p class="lead">Proposal by Getê Marketing. Press play, sound on.</p>
  <div class="grid">
    <figure id="myths">
      <video src="myths.mp4" poster="myths.jpg" controls playsinline preload="metadata"></video>
      <figcaption>Dental myths New Yorkers still believe<span>21s · Myth vs. fact</span></figcaption>
    </figure>
    <figure id="first-visit">
      <video src="first-visit.mp4" poster="first-visit.jpg" controls playsinline preload="metadata"></video>
      <figcaption>First visit? Here’s the plan.<span>21s · Step by step</span></figcaption>
    </figure>
  </div>
  <p style="margin-top:40px"><a href="../">← Back to the website prototype</a></p>
</div>
</body>
</html>
